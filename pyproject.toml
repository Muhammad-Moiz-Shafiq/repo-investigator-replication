[project]
name = "repo-investigator"
version = "0.1.0"
description = "Autonomous agent that investigates and explains patterns in software repository history"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    # Below this line: needed to run api/main.py. Kept in base dependencies,
    # not a dependency group, because the Vercel Python builder installs
    # from pyproject.toml/uv.lock directly (no --group flag) -- anything
    # api/main.py imports has to live here or the deployed function 500s on
    # import before a single route can serve traffic.
    "fastapi",
    "uvicorn[standard]",
    "openai>=1.40",
    "psycopg[binary]>=3.1",
    "langfuse>=2.50",
]

[dependency-groups]
ingestion = [
    "httpx>=0.27",
    "gql[httpx]>=3.5",
    "tenacity>=9.0",
]
spark = [
    "pyspark>=3.5",
]
db = [
    "psycopg[binary]>=3.1",
    "supabase>=2.9",
]
orchestration = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]
agent = [
    "openai>=1.40",
    "langfuse>=2.50",
]
interface = [
    "streamlit>=1.38",
]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.6",
    "moto[s3]>=5",
]
analysis = [
    "matplotlib>=3.9",
]

[tool.vercel]
entrypoint = "api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_investigator"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
